<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/boxicons@2.1.2/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Cristal 💛</title>
    <script>
      // Controlador de música global MEJORADO
      document.addEventListener('DOMContentLoaded', function() {
        const musica = document.getElementById('musicaFondo');
        musica.volume = 0.5; // Volumen inicial
        
        // Guardar estado al salir de la página
        window.addEventListener('beforeunload', function() {
          sessionStorage.setItem('musicaPlaying', !musica.paused);
          sessionStorage.setItem('musicaVolume', musica.volume);
          sessionStorage.setItem('musicaCurrentTime', musica.currentTime);
        });
        
        // Función global para play/pause
        window.toggleMusic = function() {
          if (musica.paused) {
            musica.play()
              .then(() => {
                document.querySelector('.music-controls i').className = 'bx bx-pause';
                sessionStorage.setItem('musicaPlaying', true);
              })
              .catch(e => {
                alert("Por favor toca cualquier parte de la página primero para activar la música");
              });
          } else {
            musica.pause();
            document.querySelector('.music-controls i').className = 'bx bx-play';
            sessionStorage.setItem('musicaPlaying', false);
          }
        };
        
        // Función global para volumen
        window.changeVolume = function(vol) {
          musica.volume = vol;
          sessionStorage.setItem('musicaVolume', vol);
        };
        
        // Activar al primer click (requerido para móviles)
        document.body.addEventListener('click', function initAudio() {
          musica.play()
            .then(() => {
              document.querySelector('.music-controls i').className = 'bx bx-pause';
              sessionStorage.setItem('musicaPlaying', true);
            })
            .catch(e => console.log("Autoplay bloqueado:", e));
          document.body.removeEventListener('click', initAudio);
        }, { once: true });
      });
    </script>
</head>

<body>
    <h1>¡Feliz Cumpleaños Criss! 💛</h1>
    
    <ul class="proyectos">
      <li><a href="./carta de cum/index.html">Carta De Cumpleaños</a></li>
      <li><a href="./chat recuerdos/index.html">Chat de Recuerdos</a></li>
    </ul>

    <!-- Reproductor de audio -->
    <audio loop id="musicaFondo" style="display:none;">
      <source src="./Audio/Desvelado.mp3" type="audio/mpeg">
      Tu navegador no soporta audio HTML5
    </audio>

    <!-- Controles de música flotantes -->
    <div class="music-controls">
      <button onclick="toggleMusic()"><i class='bx bx-play'></i></button>
      <span class="song-title">Desvelado...</span>
      <input type="range" oninput="changeVolume(this.value)" min="0" max="1" step="0.1" value="0.5">
    </div>
</body>
</html>
